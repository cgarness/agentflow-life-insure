name: Underwriting source-reviewed expansion (one time)

# Mechanical transport of an immutable, locally tested patch onto the approved
# feature branch. No production credentials, deployments, data or main writes.
# Removed by the connector after its verification run.
on:
  push:
    branches: ['work/fflagent-underwriting-v1']
    paths: ['docs/plans/2026-09-30-underwriting/review-stage/**', '.github/workflows/underwriting-expand-once.yml']
permissions:
  contents: read
concurrency:
  group: underwriting-source-expansion
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'cgarness/agentflow-life-insure' && github.ref == 'refs/heads/work/fflagent-underwriting-v1' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check byte identity, patch preimages and exact file scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip,hashlib,io,subprocess
          chunks=[f'docs/plans/2026-09-30-underwriting/review-stage/part-{i}.bin' for i in range(1,4)]
          data=b''.join(Path(p).read_bytes() for p in chunks)
          assert len(data)==22762
          assert hashlib.sha256(data).hexdigest()=='d096033fca3f746562ad96aba0bfa772c0af9529b27e4abd0b7df4398c0d9c51'
          with gzip.GzipFile(fileobj=io.BytesIO(data)) as f: patch=f.read(100001)
          assert len(patch)==70552
          allowed=set('''src/underwriting/transamerica-data.ts
          src/underwriting/rules/transamerica.ts
          src/underwriting/rules/transamerica-conditions.ts
          src/underwriting/ui/transamerica-questions.ts
          src/underwriting/ui/questions.ts
          src/underwriting/ui/health.ts
          src/underwriting/ui/mount.ts
          src/underwriting/ui/results.ts
          src/underwriting/engine.ts
          src/underwriting/sources.ts
          src/underwriting/data.ts
          src/underwriting/rules/mutual.ts
          tests/underwriting/engine.test.cjs
          tests/underwriting/transamerica.test.cjs
          tests/underwriting/browser.py
          docs/plans/2026-09-30-underwriting/SOURCE_RECONCILIATION.md'''.split())
          expected={line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/')}
          assert expected==allowed
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          log=Path('WORK_LOG.md');old_log=log.read_bytes()
          base_log=subprocess.check_output(['git','show','5fc4649f45a323c1ddc0863ffb4ec7fd0bb3f326:WORK_LOG.md'])
          assert old_log.endswith(base_log) and len(base_log)==2160468
          entry='''## 2026-09-30 Pacific — Underwriting: direct source reconciliation and implemented Transamerica rules — FEATURE BRANCH

          - Directly performed by ChatGPT under Chris's approved integration request. No Cursor/Claude handoff.
          - The actual supplied Transamerica PDF was retrieved through read-only run 36814852215. Its bytes, text and locally rendered pages agree on 3247945R12 (08/26), Premier and the 100k age-qualified maximum. SHA256 and per-page review are in SOURCE_RECONCILIATION.md. The earlier inconsistent web rendering is not merged into this source.
          - Implemented Transamerica's supported single-condition factors, exact measured build bands, current-medication exclusions, qualified cancer rows, tobacco/nonmedical checks and required current-application confirmation. Unknown diagnoses/medication impact, exact undefined time boundaries and uncertain combinations remain review; ceilings are not offers.
          - Added carrier-specific progressive follow-ups and 226 new source/boundary regressions. Valid complete commission references may order equivalent candidate peers, never override underwriting/benefit priority. Missing schedules still produce no invented payout ranking.
          - Visually verified the exact Mutual of Omaha Living Promise build and Rx columns against the pinned April 2026 PDF. State-specific health-form mapping remains partial. Corrected progress-label wrapping and unconfirmed-benefit wording.
          - Files: src/underwriting/{transamerica-data,engine,sources,data}.ts; rules/{transamerica,transamerica-conditions,mutual}.ts; ui/{transamerica-questions,questions,health,mount,results}.ts; tests/underwriting/{engine.test,transamerica.test}.cjs and browser.py; source reconciliation; plan; this log. Temporary transport files/workflow are removed after use.
          - Verification: 389 local core/source regressions and strict core tsc passed. Before this expansion, integrated run 36814772583 passed the full Vite build, strict React/Zod checks, 4 host tests, 22 built-browser groups and no new application TypeScript diagnostics relative to main's 90 pre-existing errors. The expanded full-repository run follows this commit; its final evidence belongs in VERIFICATION.md.
          - No main merge, production deployment, Supabase command/migration, RLS, DNS/environment or telephony change. Original Work Log history is preserved byte-for-byte.
          - Remaining release gates: physical iOS Safari; current state-form coverage review; producer-only material presentation permission; actual applicable commission schedules. Review build is not a guaranteed-approval tool.

          '''
          entry='\n'.join(line[10:] if line.startswith(' '*10) else line for line in entry.split('\n'))
          log.write_bytes(entry.encode()+old_log)
          assert log.read_bytes().endswith(old_log)
          plan=Path('docs/plans/2026-09-30-underwriting/implementation_plan.md')
          plan.write_text(plan.read_text()+'''\n## As-built source expansion — 2026-09-30 Pacific\n\nThe preceding initial Transamerica hold is historical. Exact direct PDF retrieval resolved the mismatch; see SOURCE_RECONCILIATION.md for hashes and supported scope. Added transamerica-data.ts, rules/transamerica-conditions.ts and ui/transamerica-questions.ts, extended source/boundary and real-browser tests, and visually verified Living Promise table columns. Local core tests: 389 passed. The full integrated first release passed run 36814772583; expanded integration checks follow this commit. All code remains on the approved feature branch, with no production changes. Final verification is recorded separately; unknown rules and missing commission schedules are not silently filled.\n''')
          subprocess.run(['git','add','--',*sorted(allowed),'WORK_LOG.md',str(plan)],check=True)
          subprocess.run(['git','rm','--',*chunks],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==allowed|{'WORK_LOG.md',str(plan)}|set(chunks)
          print('Verified expansion:',len(allowed),'source/test files; original log bytes preserved:',len(base_log))
          PY
      - name: Commit to the feature branch only
        id: commit
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/fflagent-underwriting-v1
          git config user.name 'AgentFlow implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: activate source-verified Transamerica factors and carrier follow-ups'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          actual=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/work/fflagent-underwriting-v1 | cut -f1)
          test "$actual" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/work/fflagent-underwriting-v1
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: integrate
    permissions:
      contents: read
    uses: ./.github/workflows/underwriting-checks.yml
    with:
      source_ref: ${{ needs.integrate.outputs.commit }}
