name: Apply approved AgentFlow UV build
on:
  push:
    branches: ['codex/uv-profile-sync-20261017']
    paths: ['scripts/tests/uv-profile/build-patch.txt']
permissions:
  contents: read
jobs:
  apply-exact-build:
    if: github.repository == 'cgarness/agentflow-life-insure' && github.ref == 'refs/heads/codex/uv-profile-sync-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate and commit exact source manifest; no application execution
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          repo = 'cgarness/agentflow-life-insure'
          branch = 'codex/uv-profile-sync-20261017'
          head = os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          assert git('rev-parse', 'HEAD') == head
          payloads = [Path('scripts/tests/uv-profile/build-patch.part-' + str(i)) for i in range(1, 8)] + [Path('scripts/tests/uv-profile/build-patch.txt')]
          encoded = ''.join(p.read_text().strip() for p in payloads) + '\n'
          assert len(encoded) < 100000
          for p in payloads:
              print(str(p), git('hash-object', str(p)))
          assert hashlib.sha256(encoded.encode()).hexdigest() == '93e1db7ddc717acd33e61453e6de78b592d000bf6f5f82280f5604767daef983'
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(encoded.strip(), validate=True))) as f:
              raw = f.read(1000001)
          assert len(raw) <= 1000000
          manifest = json.loads(raw)
          assert manifest['repository'] == repo and manifest['branch'] == branch
          assert manifest['base_sha'] == '286bc4f64d7fbcd3a94cbef2d7b296bda99f9fde'
          subprocess.run(['git', 'merge-base', '--is-ancestor', manifest['base_sha'], head], check=True)
          assert not git('status', '--porcelain')
          files = manifest['files']
          assert len(files) == 22
          for name, hashes in files.items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts and not any(p.startswith('.env') or p == '.git' for p in path.parts)
              assert not name.startswith('.github/') and str(path) == name
              assert not path.is_symlink()
              if hashes['before'] is None:
                  assert not path.exists(), name
              else:
                  assert git('hash-object', name) == hashes['before'], name
          patch = Path(os.environ['RUNNER_TEMP']) / 'reviewed-af-build.patch'
          patch.write_text(manifest['patch'])
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          for name, hashes in files.items():
              assert git('hash-object', name) == hashes['after'], name
          changed = set(git('diff', '--name-only').splitlines()) | set(git('ls-files', '--others', '--exclude-standard').splitlines())
          assert changed == set(files), (changed, set(files))
          for path in payloads:
              path.unlink()
          subprocess.run(['git', 'add', '--', *files, *map(str, payloads)], check=True)
          staged = set(git('diff', '--cached', '--name-only').splitlines())
          assert staged == set(files) | set(map(str, payloads))
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'feat: connect agent profiles to Underwriter Verified with isolated durable synchronization'], check=True)
          remote = git('ls-remote', 'origin', 'refs/heads/' + branch).split()[0]
          assert remote == head, 'Concurrent branch update; stop without force push'
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
          print('APPROVED_AF_BUILD_COMMIT=' + git('rev-parse', 'HEAD'))
          PY
