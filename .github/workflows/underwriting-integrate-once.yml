name: Underwriting one-time approved branch integration

# Temporary deterministic file transport: no production secrets, no main writes.
# Remove this workflow through the GitHub connector after the run completes.
on:
  push:
    branches: ['work/fflagent-underwriting-v1']
    paths:
      - 'docs/plans/2026-09-30-underwriting/stage/**'
      - '.github/workflows/underwriting-integrate-once.yml'
permissions:
  contents: read
concurrency:
  group: underwriting-one-time-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'cgarness/agentflow-life-insure' && github.ref == 'refs/heads/work/fflagent-underwriting-v1' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable payload, exact paths and unchanged preimages
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import gzip,hashlib,io,json,subprocess
          root=Path.cwd()
          prefix='docs/plans/2026-09-30-underwriting/stage/'
          chunks=[prefix+f'part-{i:02d}.bin' for i in range(1,5)]
          raw=b''.join(Path(p).read_bytes() for p in chunks)
          assert len(raw)==34105
          assert hashlib.sha256(raw).hexdigest()=='fcc882c8d00e825992a243c051820c3a0acb8a3c0c36f8a0552b0fc7d8e370d1'
          with gzip.GzipFile(fileobj=io.BytesIO(raw)) as f:
              decoded=f.read(1_000_001)
          assert len(decoded)<=1_000_000
          files=json.loads(decoded)['files']
          allowed=set('''tsconfig.underwriting.json
          tsconfig.underwriting.core.json
          src/main.tsx
          docs/plans/2026-09-30-underwriting/SOURCE_RECONCILIATION.md
          docs/plans/2026-09-30-underwriting/VERIFICATION.md
          scripts/underwriting/check.sh
          tests/underwriting/engine.test.cjs
          tests/underwriting/source-contract.test.cjs
          tests/underwriting/browser.py
          src/underwriting/routing.ts
          src/underwriting/data.ts
          src/underwriting/bootstrap.tsx
          src/underwriting/types.ts
          src/underwriting/engine.ts
          src/underwriting/validation.ts
          src/underwriting/UnderwritingPage.tsx
          src/underwriting/schema.ts
          src/underwriting/sources.ts
          src/underwriting/ui/dom.ts
          src/underwriting/ui/commission.ts
          src/underwriting/ui/health.ts
          src/underwriting/ui/results.ts
          src/underwriting/ui/basics.ts
          src/underwriting/ui/fields.ts
          src/underwriting/ui/mount.ts
          src/underwriting/ui/questions.ts
          src/underwriting/ui/icons.ts
          src/underwriting/__tests__/host.test.tsx
          src/underwriting/rules/mutual.ts
          src/underwriting/rules/americo.ts
          src/underwriting/rules/transamerica.ts'''.split())
          assert len(files)==len(allowed)==31
          assert {f['path'] for f in files}==allowed
          def blob(path):
              return subprocess.check_output(['git','hash-object',path],text=True).strip()
          assert blob('src/main.tsx')=='68176a72f30ae0650f5093c8b6a7b01016acf07a'
          assert blob('WORK_LOG.md')=='5091dd4bf5addb6578a6a8251619d8e2e4ea3682'
          old_log=Path('WORK_LOG.md').read_bytes()
          for f in files:
              p=PurePosixPath(f['path'])
              assert not p.is_absolute() and '..' not in p.parts
              target=root.joinpath(*p.parts)
              assert target.resolve().is_relative_to(root)
              assert not any(parent.is_symlink() for parent in [target,*target.parents])
              if f['path']!='src/main.tsx': assert not target.exists(),f['path']
              data=f['content'].encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==f['sha256'],f['path']
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
          entry='''## 2026-09-30 — Public underwriting direct integration — FEATURE BRANCH ONLY; REPOSITORY CHECKS PENDING

          - Authority: Chris explicitly requested ChatGPT carry out the implementation rather than hand off to Cursor or Claude. Plan: docs/plans/2026-09-30-underwriting/implementation_plan.md.
          - Branch: work/fflagent-underwriting-v1 from main 5fc4649f45a323c1ddc0863ffb4ec7fd0bb3f326. Public destination /underwriting, with /underwritin alias on FFLAGENT.com.
          - Changes: standalone public entry before importing App; mobile-first underwriting UI; strict Zod forms; sourced preliminary evaluator; optional in-memory unverified commission reference; invalidation/reset; full-document home link; pagehide/pageshow sensitive-state clearing.
          - Files: src/main.tsx; src/underwriting/**; tests/underwriting/**; scripts/underwriting/check.sh; tsconfig.underwriting.json and tsconfig.underwriting.core.json; task plan/source/verification documents; isolated feature checks workflow; this log.
          - Verification before repository integration: 163 core/source tests and 18 offline browser groups passed. Actual React/Zod/Tailwind 3 integration and built-route checks run separately and are PENDING at this commit; do not represent them as passed yet.
          - Source gates: Americo uses approved 11/25 guide with ceilings distinct from offers; Transamerica is held for inconsistent retrieved versions; Mutual of Omaha state-form coverage is partial; no verified commission schedule or default highest-paying carrier. Public producer-material use review remains required.
          - Production: no main merge, production deployment, DNS/environment change, Supabase mutation/migration or telephony change. The original Work Log is preserved byte-for-byte after this entry.
          - Next: complete isolated runner checks, inspect the exact final diff and open a draft PR. Release needs separately reviewed approval and source-readiness resolution.

          '''
          entry='\n'.join(line[10:] if line.startswith(' '*10) else line for line in entry.split('\n'))
          Path('WORK_LOG.md').write_bytes(entry.encode()+old_log)
          assert Path('WORK_LOG.md').read_bytes().endswith(old_log)
          subprocess.run(['git','add','--',*sorted(allowed),'WORK_LOG.md'],check=True)
          subprocess.run(['git','rm','--',*chunks],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==allowed|{'WORK_LOG.md'}|set(chunks),changed
          print('Validated and staged',len(allowed),'source files; preserved',len(old_log),'Work Log bytes.')
          PY
      - name: Commit only to the approved feature branch
        id: commit
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/fflagent-underwriting-v1
          git config user.name 'AgentFlow implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate isolated public underwriting UI and sourced evaluator (review build)'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          actual=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/work/fflagent-underwriting-v1 | cut -f1)
          test "$actual" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/work/fflagent-underwriting-v1
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: integrate
    permissions:
      contents: read
    uses: ./.github/workflows/underwriting-checks.yml
    with:
      source_ref: ${{ needs.integrate.outputs.commit }}
