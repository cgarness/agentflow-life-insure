name: Recent-outbound released-source verification

# Production release is recorded in the plan. This workflow has NO production credentials,
# never deploys or activates anything, and does not write repository files.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: isolated-test-only
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgresql://postgres:isolated-test-only@127.0.0.1:55433
      RO_MAIN_SHA: e04eb16dc6fc70734f85868ab5235186d0ce4813
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Prepare isolated verification environment
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20261002203426_inbound_recent_outbound_routing.sql
          echo "RO_BASE_WORKTREE=$RUNNER_TEMP/ro-base" >> "$GITHUB_ENV"
          echo "RO_EVIDENCE=$RUNNER_TEMP/ro-evidence" >> "$GITHUB_ENV"
          echo "DENO_DIR=$RUNNER_TEMP/ro-deno-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ro-evidence"
          git worktree add --detach "$RUNNER_TEMP/ro-base" "$RO_MAIN_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/ro-base/node_modules"
          npm install --prefix "$RUNNER_TEMP/ro-deno" deno@2.1.4 --no-audit --no-fund
          echo "DENO_BIN=$RUNNER_TEMP/ro-deno/node_modules/.bin/deno" >> "$GITHUB_ENV"
      - name: SQL and generated types using recorded migration filenames
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_recent_outbound_activation_tests.sh 2>&1 | tee "$RO_EVIDENCE/activation.txt"
          bash scripts/run_inbound_sql_tests.sh 2>&1 | tee "$RO_EVIDENCE/inbound.txt"
          bash scripts/run_inbound_rollback_test.sh 2>&1 | tee "$RO_EVIDENCE/rollback.txt"
          bash scripts/verify_inbound_generated_types.sh 2>&1 | tee "$RO_EVIDENCE/types.txt"
          bash scripts/verify_inbound_generated_types_negative.sh 2>&1 | tee "$RO_EVIDENCE/types-negative.txt"
      - name: Existing baseline-aware application and package verification
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_recent_outbound_release.py 2>&1 | tee "$RO_EVIDENCE/verification.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recent-outbound-released-source-${{ github.run_id }}
          path: ${{ runner.temp }}/ro-evidence/
          retention-days: 7
