name: Recent-outbound final preparation

on:
  push:
    branches: [chatgpt/recent-outbound-final-20261002]
    paths:
      - .github/workflows/recent-outbound-release-verify.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recent-outbound-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/chatgpt/recent-outbound-final-20261002'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: isolated-test-only
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Check pinned inputs and export credential-free Git bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ro-artifacts"
          MAIN=e04eb16dc6fc70734f85868ab5235186d0ce4813
          TASK=efa815144f893fafa43960f177a67ec90f92e4e1
          B1=02b8ba5c91def63ebfe7670c33a4981dc452037b
          for SHA in "$MAIN" "$TASK" "$B1"; do git cat-file -e "$SHA^{commit}"; done
          git update-ref refs/heads/input-main "$MAIN"
          git update-ref refs/heads/input-task-a "$TASK"
          git update-ref refs/heads/input-b1 "$B1"
          git update-ref refs/heads/input-preparation "$GITHUB_SHA"
          git bundle create "$RUNNER_TEMP/ro-artifacts/source.bundle" refs/heads/input-main refs/heads/input-task-a refs/heads/input-b1 refs/heads/input-preparation
          git bundle verify "$RUNNER_TEMP/ro-artifacts/source.bundle"
          printf '%s\n' "main=$MAIN" "task_a=$TASK" "b1=$B1" "preparation=$GITHUB_SHA" > "$RUNNER_TEMP/ro-artifacts/inputs.txt"
          git worktree add --detach "$RUNNER_TEMP/ro-task-a" "$TASK"
          git worktree add --detach "$RUNNER_TEMP/ro-b1" "$B1"
      - name: Install pinned project dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Export installed dependencies for offline local verification
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/ro-artifacts/node_modules.tar.gz" node_modules
          sha256sum "$RUNNER_TEMP/ro-artifacts/source.bundle" "$RUNNER_TEMP/ro-artifacts/node_modules.tar.gz" | tee "$RUNNER_TEMP/ro-artifacts/bootstrap.sha256"
      - name: Run original Task A SQL against isolated PostgreSQL 17.6
        env:
          PGURL: postgresql://postgres:isolated-test-only@127.0.0.1:55433
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.parse
          u = urllib.parse.urlparse(os.environ['PGURL'])
          assert u.hostname == '127.0.0.1' and u.port == 55433
          assert 'jncvvsvckxhqgqvkppmj' not in os.environ['PGURL']
          print('Synthetic database on localhost:55433 only')
          PY
          psql "$PGURL/postgres" -v ON_ERROR_STOP=1 -c 'SHOW server_version;'
          cd "$RUNNER_TEMP/ro-task-a"
          bash scripts/run_inbound_sql_tests.sh 2>&1 | tee "$RUNNER_TEMP/ro-artifacts/task-a-pg17.6.txt"
      - name: Install isolated Deno tool and resolve exact remote imports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/ro-deno-tool" deno@2.1.4 --no-audit --no-fund
          export DENO_DIR="$RUNNER_TEMP/ro-deno-cache"
          DENO="$RUNNER_TEMP/ro-deno-tool/node_modules/.bin/deno"
          "$DENO" --version | tee "$RUNNER_TEMP/ro-artifacts/deno-version.txt"
          for ITEM in 'main:.' "task-a:$RUNNER_TEMP/ro-task-a" "b1:$RUNNER_TEMP/ro-b1"; do
            LABEL="${ITEM%%:*}"; ROOT="${ITEM#*:}"
            for FN in twilio-voice-status twilio-recording-status twilio-voice-inbound; do
              set +e
              "$DENO" check --no-config --no-lock "$ROOT/supabase/functions/$FN/index.ts" > "$RUNNER_TEMP/ro-artifacts/deno-$LABEL-$FN.txt" 2>&1
              CODE=$?
              set -e
              printf '%s %s exit=%s\n' "$LABEL" "$FN" "$CODE" | tee -a "$RUNNER_TEMP/ro-artifacts/deno-exits.txt"
            done
          done
          tar -czf "$RUNNER_TEMP/ro-artifacts/deno-tool-and-cache.tar.gz" -C "$RUNNER_TEMP" ro-deno-tool ro-deno-cache
          sha256sum "$RUNNER_TEMP/ro-artifacts/deno-tool-and-cache.tar.gz" | tee -a "$RUNNER_TEMP/ro-artifacts/bootstrap.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recent-outbound-offline-workspace-${{ github.run_id }}
          path: ${{ runner.temp }}/ro-artifacts/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
