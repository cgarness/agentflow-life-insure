name: Group leaderboard backend verification
# Real PostgreSQL proof of the Group leaderboard "Appointments Set" setter-credit migration
# (supabase/migrations/20260929160000_group_leaderboard_appointment_setter_credit.sql). Synthetic tenants only; the
# runner refuses any non-localhost database, and no production credential exists in this job.
on:
  pull_request:
    paths:
      - 'supabase/migrations/*group_leaderboard*.sql'
      - 'supabase/migrations/rollback/*group_leaderboard*.sql'
      - 'supabase/tests/group_leaderboard_*.sql'
      - 'scripts/run_group_leaderboard_tests.sh'
      - 'supabase/migrations/20260806000000_baseline_production_schema.sql'
      - '.github/workflows/group-leaderboard-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: group-leaderboard-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: postgres
        ports: ['55434:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Group leaderboard suite, negative control, drift/replay refusal, rollback, pre-existing 42702 proof
        env:
          PGURL: postgresql://postgres:isolated-test-only@127.0.0.1:55434
        run: |
          set -o pipefail
          bash scripts/run_group_leaderboard_tests.sh | tee group-leaderboard-backend-results.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: group-leaderboard-backend-evidence-${{ github.run_id }}
          path: group-leaderboard-backend-results.txt
          retention-days: 14
