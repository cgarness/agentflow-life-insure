name: Underwriting chat verification closeout (one time)
on:
  push:
    branches: ['work/fflagent-underwriting-v1']
    paths: ['.github/workflows/underwriting-chat-closeout-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  record:
    if: github.repository == 'cgarness/agentflow-life-insure' && github.ref == 'refs/heads/work/fflagent-underwriting-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful exact-source checks and preserve all existing history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess,time,urllib.request
          from pathlib import Path
          repo='cgarness/agentflow-life-insure'
          candidate='2bfda65f8334de5d1d64c269be58130598a8fcca'
          run_id=36877635480
          assert os.environ['GITHUB_REF']=='refs/heads/work/fflagent-underwriting-v1'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==candidate
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          for _ in range(48):
              run=get('/actions/runs/'+str(run_id))
              assert run['head_sha']==candidate
              if run['status']=='completed':break
              time.sleep(10)
          assert run['status']=='completed' and run['conclusion']=='success','Exact candidate checks have not passed'
          job=next(j for j in get('/actions/runs/'+str(run_id)+'/jobs')['jobs'] if j['name']=='frontend')
          assert job['conclusion']=='success'
          for name in ['Strict checks, evaluator tests, React host tests and production build','Compare application TypeScript diagnostics to the unchanged base','Lint only the changed feature','Exercise the actual built public route']:
              assert next(s for s in job['steps'] if s['name']==name)['conclusion']=='success',name
          log=Path('WORK_LOG.md')
          assert subprocess.check_output(['git','hash-object',str(log)],text=True).strip()=='17b05d777408840f8c5747111a526e1f4455245f'
          old_log=log.read_bytes();assert len(old_log)>2_000_000
          plan=Path('docs/plans/2026-09-30-underwriting/chat/implementation_plan.md')
          verification=Path('docs/plans/2026-09-30-underwriting/chat/VERIFICATION.md')
          old_plan=plan.read_bytes();old_verification=verification.read_bytes()
          lines=[
              '## 2026-10-01 — AgentFlow dark chat underwriting — REVIEW BUILD VERIFIED; NOT RELEASED',
              '',
              '- Continued directly under Chris’s approved chat-first/dark AgentFlow implementation. Feature branch work/fflagent-underwriting-v1, draft PR #398; no main merge.',
              '- Verified exact candidate '+candidate+' with successful isolated run '+str(run_id)+': root/strict feature TypeScript, core/source/chat and React tests, full Vite build, unchanged-base application diagnostic comparison, scoped lint, and actual built-route Chromium plus WebKit scripts.',
              '- Fixed the continuation test failure: pagehide/pageshow deliberately remounts the blank public page, which may reload its logo. The lifecycle check now permits only the exact same-origin bodyless GET for that static logo; query-bearing, POST and API requests have negative controls. All ordinary case-entry flows still require zero requests.',
              '- Browser security evidence uses primitive observations, a unique script sentinel, authored literal-note preservation, injected node/event/request assertions, exact source/script fingerprints, and persisted failure/incomplete-run evidence. Security checks were not disabled.',
              '- Existing implemented UI: AgentFlow dark styling/logo; compact basics; one chat composer; confirmable medication spelling; no more than two prompts; short green/yellow/red carrier cards and collapsed explanations.',
              '- Capability limits: bounded local phrase matching, not a connected language model or live RxNorm; no verified compensation/default payout ordering; incomplete state/combination authority remains visible. No guaranteed approvals.',
              '- Files in this continuation: tests/underwriting/browser.py; task verification/plan; newest-first Work Log; temporary branch-only documentation workflow removed after use. Existing history is preserved byte-for-byte.',
              '- Production: no main merge, deployment/promotion, Supabase/database/RLS, DNS/environment, CRM/dialer or telephony mutation. Existing Git integration generates preview builds only.',
              '- Next: hosted review and feedback; separate exact approval for live AI endpoint/provider activation and eventual production release. Physical iPhone testing and source/public-presentation/commission gates remain.',
              '',
              ''
          ]
          entry='\n'.join(lines).encode()
          log.write_bytes(entry+old_log)
          assert log.read_bytes()[len(entry):]==old_log
          assert hashlib.sha256(log.read_bytes()[len(entry):]).digest()==hashlib.sha256(old_log).digest()
          record=[
              '# Chat-first preview: completed verification, 2026-10-01',
              '',
              'Tested candidate: `'+candidate+'`.',
              'Green exact-source push run: https://github.com/'+repo+'/actions/runs/'+str(run_id),
              '',
              'Root and strict feature TypeScript, core/source/chat and React tests, full Vite production build, scoped ESLint, baseline application diagnostic comparison, and both actual-built-route Chromium and WebKit scripts passed. Retained per-browser reports identify the checked-out SHA and script fingerprint and must say completed=true. Older incomplete-browser records below are historical, not final results.',
              '',
              'Coverage: direct routes and alias; dark AgentFlow logo/theme; five widths (320/375/390/768/1440); shorthand case and at most two prompts; medication correction without diagnosis inference; unknowns and adverse corrections; reset/page lifecycle; literal hostile-note retention with no injected nodes/events/requests; identifying-format rejection; Enter/Shift+Enter.',
              '',
              'A genuine test-boundary issue was corrected: restoring the cleared page can reload its public logo. Only that exact same-origin bodyless static GET is allowed during restoration, with negative controls for query parameters, POST bodies and API traffic. Ordinary case entry still requires no requests. Primitive security snapshots do not inject a helper, clear sentinels or alter the application under test.',
              '',
              'No application component or carrier eligibility rule changed in this continuation. This is local supported-phrase interpretation, not live generative AI/RxNorm. Missing verified commission schedules, current state/combination authority, producer-material public-presentation review, physical iPhone acceptance and eventual production release remain separate gates. Existing app diagnostics are not erased and the unrelated full suite is not claimed. No production/backend/DNS/environment change.',
              '',
              '## Earlier verification history (preserved)',
              '',
              ''
          ]
          verification.write_bytes('\n'.join(record).encode()+old_verification)
          plan.write_bytes(old_plan+('\n\n## 2026-10-01 continuation closeout\n\nCandidate '+candidate+' passed isolated run '+str(run_id)+', including Chromium and WebKit on the actual Vite build. This closes the browser-verification step for the local-parser dark chat preview, not live-AI, commission, source-coverage or release gates. Work Log history is preserved; see newest verification record.\n').encode())
          own=Path('.github/workflows/underwriting-chat-closeout-once.yml');own.unlink()
          allowed={str(log),str(plan),str(verification),str(own)}
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==allowed
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          print('Verified candidate and preserved',len(old_log),'original Work Log bytes')
          PY
      - name: Commit only bounded documentation to the approved branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/work/fflagent-underwriting-v1'
          git config user.name 'AgentFlow implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record verified dark chat preview and preserve work history'
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          actual=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/work/fflagent-underwriting-v1 | cut -f1)
          test "$actual" = "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/work/fflagent-underwriting-v1
