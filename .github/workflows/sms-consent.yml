name: SMS consent integration
on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'src/components/messaging/**'
      - 'src/components/conversations/**'
      - 'src/components/contacts/**'
      - 'src/components/settings/**'
      - 'src/hooks/useSmsConsentStatus.ts'
      - 'src/hooks/useScopedDraft.ts'
      - 'src/lib/sms-*'
      - 'scripts/test-sms-consent.mjs'
      - 'scripts/tests/sms-visual/**'
      - '.github/workflows/sms-consent.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sms-consent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  consent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cgarness/underwriter-verified
          ref: d2a9c3266dec05211c54d5a86c10ef3b947d5922
          path: paired-uv
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --prefix "$RUNNER_TEMP/sms-tools" --no-package-lock deno@2.5.2 @electric-sql/pglite@0.3.14 playwright@1.56.1
      - name: Real native PostgreSQL integration and concurrent dispatch
        env:
          SMS_NATIVE_PG: postgres://postgres:synthetic-test-password@127.0.0.1:5432/postgres
          UV_SOURCE_ROOT: ${{ github.workspace }}/paired-uv
        run: node scripts/test-sms-consent.mjs
      - name: Existing Dialer DNC native regression
        env:
          PGURL: postgres://postgres:synthetic-test-password@127.0.0.1:5432
        run: bash scripts/run_dialer_dnc_tests.sh
      - name: Edge tests and type checks
        run: |
          "$RUNNER_TEMP/sms-tools/node_modules/.bin/deno" test --allow-env supabase/functions/_shared/sms/sms_test.ts supabase/functions/_shared/a2p/workflow_test.ts
          "$RUNNER_TEMP/sms-tools/node_modules/.bin/deno" check supabase/functions/sms-consent-events/index.ts supabase/functions/sms-consent-worker/index.ts supabase/functions/sms-consent-status/index.ts supabase/functions/twilio-sms/index.ts supabase/functions/twilio-sms-webhook/index.ts supabase/functions/workflow-executor/index.ts paired-uv/supabase/functions/agentflow-consent/index.ts paired-uv/supabase/functions/consent-event-worker/index.ts
      - name: Browser fixture
        env:
          SMS_PLAYWRIGHT_MODULE: ${{ runner.temp }}/sms-tools/node_modules/playwright/index.mjs
          SMS_VISUAL_EVIDENCE: ${{ runner.temp }}/sms-visual-evidence
        run: |
          "$RUNNER_TEMP/sms-tools/node_modules/.bin/playwright" install --with-deps chromium
          node node_modules/vite/bin/vite.js build --config scripts/tests/sms-visual/vite.config.mts
          python3 -m http.server 4188 --bind 127.0.0.1 --directory /tmp/cg-sms-visual-dist &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/tests/sms-visual/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sms-consent-browser
          path: ${{ runner.temp }}/sms-visual-evidence
