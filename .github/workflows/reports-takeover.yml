name: Reports repair workspace
on:
  push:
    branches: ['codex/reports-policy-final-fixes-20261002']
    paths: ['.github/workflows/reports-takeover.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/codex/reports-policy-final-fixes-20261002'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Verify and publish only the reviewed patch on this branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reports-stage"
          tar -cf "$RUNNER_TEMP/reports-stage/staged-parts.tar" .reports-takeover
          python3 .reports-takeover/apply.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reports-stage-evidence
          path: ${{ runner.temp }}/reports-stage
          retention-days: 1
