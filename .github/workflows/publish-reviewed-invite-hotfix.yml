name: Publish reviewed Team Leader invitation hotfix
on:
  push:
    branches: [hotfix/team-leader-invitations-20261015]
    paths:
      - .github/workflows/publish-reviewed-invite-hotfix.yml
      - docs/plans/2026-10-15-team-leader-invitations/approved.patch.gz
permissions:
  contents: write
concurrency:
  group: publish-reviewed-invite-hotfix-20261015
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.repository == 'cgarness/agentflow-life-insure' && github.ref == 'refs/heads/hotfix/team-leader-invitations-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reviewed base and capture application baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 03ef0cbaecb1074655d568eb5a5a6a3d94d08866
          npm ci --no-audit --no-fund
          npx tsc -p tsconfig.app.json --noEmit > /tmp/invite-app-before.log 2>&1 || true
      - name: Apply checksum-verified reviewed patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, hashlib
          from pathlib import Path
          data = bytearray(Path('docs/plans/2026-10-15-team-leader-invitations/approved.patch.gz').read_bytes())
          # One byte was corrupted during connector transfer. Restore the byte
          # verified against the original sandbox artifact, then require the
          # exact SHA-256 of the already-tested uncompressed patch.
          assert len(data) == 13041 and data[11288] == 217
          data[11288] = 251
          patch = gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == '5786a435608dc397784f9693faa87912c35312ae4fffb30575f42d7c805b1e46'
          Path('/tmp/invite-hotfix.patch').write_bytes(patch)
          PY
          git apply --check /tmp/invite-hotfix.patch
          git apply /tmp/invite-hotfix.patch
      - name: Verify exact application patch
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npx tsc -p tsconfig.app.json --noEmit > /tmp/invite-app-after.log 2>&1 || true
          diff -u /tmp/invite-app-before.log /tmp/invite-app-after.log
          npx vitest run src/lib/__tests__/teamLeaderInvitations.test.ts src/components/settings/user-management/__tests__/InviteUserModal.test.tsx src/pages/__tests__/acceptInvitePage.test.tsx src/pages/__tests__/onboardingInviteFlow.test.tsx
          npx eslint src/components/settings/user-management/InviteUserModal.tsx src/components/settings/UserManagement.tsx src/lib/__tests__/teamLeaderInvitations.test.ts src/components/settings/user-management/__tests__/InviteUserModal.test.tsx
          npm run build
          git diff --check
      - name: Commit only the reviewed files and remove publishing helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/hotfix/team-leader-invitations-20261015
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git rm .github/workflows/publish-reviewed-invite-hotfix.yml docs/plans/2026-10-15-team-leader-invitations/approved.patch.gz
          git add AGENT_RULES.md WORK_LOG.md docs/plans/2026-10-15-team-leader-invitations/implementation_plan.md src/components/settings/UserManagement.tsx src/components/settings/user-management/InviteUserModal.tsx src/components/settings/user-management/__tests__/InviteUserModal.test.tsx src/lib/__tests__/teamLeaderInvitations.test.ts supabase/functions/invite-user/index.ts supabase/functions/send-invite-email/index.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(users): allow Team Leaders to invite Agents into their direct downline'
          git -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/hotfix/team-leader-invitations-20261015
