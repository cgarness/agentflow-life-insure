name: Underwriting minimal source export (temporary)
on:
  push:
    branches: ['work/fflagent-underwriting-v1']
    paths: ['.github/workflows/underwriting-minimal-export-once.yml']
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'cgarness/agentflow-life-insure' && github.ref == 'refs/heads/work/fflagent-underwriting-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9a80c88193979669ac2d5df707374e7963d1879e
          persist-credentials: false
      - name: Export only tracked feature source, test and documentation paths
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/underwriting-minimal"
          git archive --format=tar HEAD src/underwriting tests/underwriting scripts/underwriting docs/plans/2026-09-30-underwriting AGENT_RULES.md VISION.md WORK_LOG.md .github/workflows/underwriting-checks.yml | gzip > "$RUNNER_TEMP/underwriting-minimal/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/underwriting-minimal/sha.txt"
          sha256sum "$RUNNER_TEMP/underwriting-minimal/source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: underwriting-minimal-source
          path: ${{ runner.temp }}/underwriting-minimal/*
          retention-days: 2
