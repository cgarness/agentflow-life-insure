name: Team dialer backend verification
on:
  pull_request:
    paths:
      - 'supabase/migrations/*team_dialer*.sql'
      - 'supabase/migrations/20260806000000_baseline_production_schema.sql'
      - 'supabase/migrations/20260811200920_campaign_leads_membership_uniqueness_and_attachment_core.sql'
      - 'supabase/migrations/20260811201250_import_campaign_creation_and_retry.sql'
      - 'supabase/migrations/20260925183605_guard_shared_campaign_recent_calls.sql'
      - 'supabase/ops/team_dialer*.sql'
      - 'supabase/tests/team_dialer*.sql'
      - 'scripts/run_team_dialer_access_tests.sh'
      - 'scripts/team_dialer_test_dependencies.py'
      - '.github/workflows/team-dialer-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: team-dialer-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: postgres
        ports: ['55434:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Authenticated authority, queue, concurrency and refusal proofs
        env:
          PGURL: postgresql://postgres:isolated-test-only@127.0.0.1:55434
        run: |
          set -o pipefail
          bash scripts/run_team_dialer_access_tests.sh 2>&1 | tee team-dialer-backend-results.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: team-dialer-backend-evidence-${{ github.run_id }}
          path: team-dialer-backend-results.txt
          retention-days: 14
