name: Dashboard attention clearances (G3 package) verification
# Pull-request checks only. A disposable PostgreSQL service and synthetic data; no secrets, no hosted project.
on:
  pull_request:
    paths:
      - 'supabase/migrations/pending/*_dashboard_attention_clearances.sql'
      - 'supabase/migrations/*_dashboard_attention_clearances.sql'
      - 'supabase/migrations/rollback/*_dashboard_attention_clearances.rollback.sql'
      - 'supabase/tests/dashboard_attention_clearances.sql'
      - 'supabase/tests/dashboard_attention_clearances_harness.sql'
      - 'scripts/run_dashboard_attention_tests.sh'
      - '.github/workflows/dashboard-attention-backend.yml'
      - '.github/workflows/dashboard-attention-release.yml'
      - 'scripts/dashboard_attention_release.py'
      - 'scripts/tests/dashboard_attention_release_test.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['55445:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Replay guard, behaviour suite, concurrency, negative controls and rollback (disposable database only)
        env:
          PGURL: postgres://postgres:isolated-test-only@127.0.0.1:55445
          PGPASSWORD: isolated-test-only
        run: bash scripts/run_dashboard_attention_tests.sh

  release-runner:
    name: G3 protected release rehearsal (Supabase CLI 2.121.0, PostgreSQL 17.6, isolated TLS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: PostgreSQL client and PyYAML
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client python3-yaml
      - name: Start disposable PostgreSQL 17.6 on loopback with TLS
        run: |
          docker run --detach --name dac-release-postgres --network host \
            -e POSTGRES_PASSWORD=isolated-test-only \
            postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929 \
            -c listen_addresses=127.0.0.1 -c port=5432 -c ssl=on \
            -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then exit 0; fi
            sleep 1
          done
          docker logs dac-release-postgres || true
          exit 1
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.121.0
      - name: Only pinned SQL, refusal gates, state transitions, migration history and rollback
        env:
          DAC_RELEASE_PGURL: postgresql://postgres:isolated-test-only@127.0.0.1:5432
        run: python3 -I scripts/tests/dashboard_attention_release_test.py
      - name: Remove disposable PostgreSQL
        if: always()
        run: docker rm --force dac-release-postgres

  environment-guard:
    name: Protected environment settings (live, read-only, no secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Required reviewer cgarness, main only, administrator bypass off
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/dashboard_attention_release.py guard-environment
