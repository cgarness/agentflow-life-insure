name: Google Sheets Pilot B (Gate E approval required)
# Preparation/merge does not activate anything. Each dispatch needs Chris's
# google-sheets-production environment review and the exact reviewed main SHA.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Exact separately approved Gate E action
        required: true
        type: choice
        options: [check, schedule-maintenance, record-schedule, activate-pilot, verify-active,
                  pause-processing, resume-processing, renewal-window, restore-renewal-window,
                  stop-monitoring, finish-rollback]
      confirm:
        description: Repeat the stage name exactly
        required: true
        type: string
      reviewed_sha:
        description: Approved full 40-character main commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: google-sheets-production
  cancel-in-progress: false
jobs:
  pilot:
    if: github.ref == 'refs/heads/main' && inputs.reviewed_sha == github.sha
    name: Gate E — ${{ inputs.stage }}
    environment: google-sheets-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.121.0
      - name: Execute only the confirmed stage
        env:
          STAGE: ${{ inputs.stage }}
          CONFIRM: ${{ inputs.confirm }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/google_sheets_pilot_release.py
