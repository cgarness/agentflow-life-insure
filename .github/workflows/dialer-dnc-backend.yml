name: Dialer DNC integrity
on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'scripts/run_dialer_dnc_tests.sh'
      - '.github/workflows/dialer-dnc-backend.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Real PostgreSQL transaction and concurrency tests
        env:
          PGURL: postgresql://postgres:local_test_only@127.0.0.1:5432
        run: bash scripts/run_dialer_dnc_tests.sh
      - name: Disposition, DNC, provider and Team/Open regressions
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:9
          VITE_SUPABASE_ANON_KEY: synthetic_test_only
        run: >-
          npx vitest run dialer twilio teamOpen teamCampaign dncCheck
          useTeamOpen caller-id-selection convertLeadModalPolicyFields
          leadDisposition outboundPathPinned
      - run: npx tsc --noEmit
