name: Contact history backend
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/*contact_history*'
      - 'supabase/tests/contact_history.sql'
      - 'scripts/run_contact_history_tests.sh'
      - '.github/workflows/contact-history-backend.yml'
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: synthetic_local_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Synthetic source policies, paging, capture and conversion tests
        env:
          PGURL: postgresql://postgres:synthetic_local_password@127.0.0.1:5432
        run: bash scripts/run_contact_history_tests.sh
