name: A2P registration
on:
  pull_request:
    paths:
      - 'src/components/settings/**'
      - 'src/config/settingsConfig.ts'
      - 'supabase/functions/**'
      - 'supabase/migrations/*a2p*'
      - 'supabase/tests/a2p_registration.sql'
      - 'scripts/*a2p*'
      - 'package*.json'
      - 'deno.lock'
      - '.github/workflows/a2p-registration.yml'
permissions:
  contents: read
concurrency:
  group: a2p-registration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Install isolated verification tools
        run: npm install --prefix "$RUNNER_TEMP/a2p-tools" --no-package-lock deno@2.5.2 @electric-sql/pglite@0.3.14
      - name: Provider, authentication, events and sender checks
        run: '"$RUNNER_TEMP/a2p-tools/node_modules/.bin/deno" test --allow-env supabase/functions/_shared/a2p/workflow_test.ts'
      - name: Edge bundles type-check
        run: >-
          "$RUNNER_TEMP/a2p-tools/node_modules/.bin/deno" check
          supabase/functions/a2p-registration/index.ts
          supabase/functions/a2p-events/index.ts
          supabase/functions/a2p-reconcile/index.ts
          supabase/functions/twilio-sms/index.ts
          supabase/functions/workflow-executor/index.ts
      - name: PostgreSQL migration, privileges, ordering and notification deduplication
        run: A2P_PGLITE_MODULE="$RUNNER_TEMP/a2p-tools/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-a2p-db.mjs
      - run: npx vitest run src/components/settings/phone/a2p/A2pRegistration.test.tsx
      - run: npx eslint src/components/settings/phone/a2p src/components/settings/PhoneSystem.tsx
      - run: npx tsc --noEmit
      - name: Actual app type-check against exact base
        env:
          A2P_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-a2p-types.mjs
      - run: npm run build
