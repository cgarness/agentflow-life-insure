name: UV profile sync verification
on:
  push:
    branches: ['codex/uv-profile-sync-20261017']
    paths: ['.github/workflows/uv-profile-sync.yml', 'src/**', 'supabase/**', 'scripts/tests/uv-profile/**']
permissions:
  contents: read
concurrency:
  group: uv-profile-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-test-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install pinned test-only PostgreSQL engine in temporary workspace
        run: |
          mkdir -p "$RUNNER_TEMP/uv-test-tools"
          cd "$RUNNER_TEMP/uv-test-tools"
          npm init -y
          npm install --ignore-scripts --save-exact --no-audit --no-fund @electric-sql/pglite@0.5.8
          tar -czf "$RUNNER_TEMP/uv-test-tools.tar.gz" node_modules package.json package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uv-test-tools-${{ github.run_id }}
          path: ${{ runner.temp }}/uv-test-tools.tar.gz
          retention-days: 1
