name: Leaderboard recovery verification
on:
  push:
    branches: [fix/leaderboard-resilience-20260923]
permissions:
  contents: read
concurrency:
  group: leaderboard-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'cgarness/agentflow-life-insure' && github.ref == 'refs/heads/fix/leaderboard-resilience-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify and unpack reviewed source payload
        id: prepare
        shell: bash
        run: |
          if [ ! -f scripts/leaderboard-recovery.bundle.b64 ]; then
            echo 'No preparation payload present; nothing to publish.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, zipfile
          raw = base64.b64decode(Path('scripts/leaderboard-recovery.bundle.b64').read_text(), validate=False)
          assert hashlib.sha256(raw).hexdigest() == '987c40438c0ec7e87fd09fb5a82604d4aeb4761703719689ba52178ceba70cc1', 'Source payload hash mismatch'
          allowed = {'src/lib/leaderboard-request-gate.ts', 'scripts/tests/leaderboard-request-gate.node.mjs', 'scripts/prepare-leaderboard-recovery.py'}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert set(z.namelist()) == allowed and len(z.namelist()) == len(allowed)
              for name in allowed:
                  p = Path(name)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(z.read(name))
          PY
          python3 scripts/prepare-leaderboard-recovery.py
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Install locked dependencies
        if: steps.prepare.outputs.ready == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependency-free request gate regression tests
        if: steps.prepare.outputs.ready == 'true'
        run: node --experimental-strip-types --test scripts/tests/leaderboard-request-gate.node.mjs
      - name: Existing and new leaderboard integration tests
        if: steps.prepare.outputs.ready == 'true'
        run: npx vitest run src/hooks/__tests__/useLeaderboardData.test.tsx src/components/dashboard/__tests__/leaderboardWidget.test.tsx src/pages/__tests__/leaderboardPage.test.tsx --reporter=verbose
      - name: Typecheck against unchanged baseline
        if: steps.prepare.outputs.ready == 'true'
        shell: bash
        run: |
          set +e
          npx tsc --noEmit -p tsconfig.app.json --pretty false > /tmp/leaderboard-head-types.txt 2>&1
          set -e
          git worktree add --detach /tmp/agentflow-baseline f78140d78b6b964aa7b7e71451e11a3e0a95a591
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/agentflow-baseline/node_modules
          set +e
          (cd /tmp/agentflow-baseline && "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit -p tsconfig.app.json --pretty false) > /tmp/leaderboard-base-types.txt 2>&1
          set -e
          python3 - <<'PY'
          import collections, pathlib, re
          def errors(path):
              return collections.Counter(re.sub(r'\(\d+,\d+\)', '(line,column)', line) for line in pathlib.Path(path).read_text().splitlines() if 'error TS' in line)
          base = errors('/tmp/leaderboard-base-types.txt'); head = errors('/tmp/leaderboard-head-types.txt')
          added = head - base
          print('Baseline type errors:', sum(base.values()), 'Head type errors:', sum(head.values()))
          for line, count in added.items(): print(count, line)
          assert not added, 'New TypeScript errors introduced'
          PY
      - name: Production build
        if: steps.prepare.outputs.ready == 'true'
        run: npm run build
      - name: Publish only the tested feature-branch source
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/fix/leaderboard-resilience-20260923'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          git add src/lib/leaderboard-request-gate.ts scripts/tests/leaderboard-request-gate.node.mjs src/hooks/useLeaderboardData.ts src/components/dashboard/widgets/LeaderboardWidget.tsx src/hooks/__tests__/useLeaderboardData.test.tsx src/components/dashboard/__tests__/leaderboardWidget.test.tsx WORK_LOG.md
          git rm scripts/leaderboard-recovery.bundle.b64
          rm scripts/prepare-leaderboard-recovery.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(leaderboard): publish verified request backpressure and regression coverage'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/leaderboard-resilience-20260923
          echo "Verified feature commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'No production database connection or deployment was performed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
