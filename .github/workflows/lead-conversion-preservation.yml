name: Lead conversion preservation verification
on:
  pull_request:
    paths:
      - 'supabase/migrations/*lead_client_conversion_preservation.sql'
      - 'supabase/migrations/rollback/*lead_client_conversion_preservation.rollback.sql'
      - 'supabase/migrations/*client_policy_sold_draft_payment_fields.sql'
      - 'supabase/migrations/*policy_identity_sale_integrity.sql'
      - 'supabase/migrations/*leaderboard_sale_recording.sql'
      - 'supabase/migrations/*policy_commission_*.sql'
      - 'supabase/migrations/*contact_history_*.sql'
      - 'supabase/tests/lead_conversion_preservation.sql'
      - 'supabase/tests/lead_conversion_differential.sql'
      - 'scripts/run_lead_conversion_preservation_tests.sh'
      - 'scripts/policy_commission_fixture.py'
      - 'scripts/policy_sale_fixture.py'
      - 'scripts/reporting_fixture.py'
      - '.github/workflows/lead-conversion-preservation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['55443:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Guards, inventory, mixed-version boundary, preservation, differential, existing suites, race and rollback
        env:
          PGURL: postgres://postgres:isolated-test-only@127.0.0.1:55443
        run: bash scripts/run_lead_conversion_preservation_tests.sh
