name: Reports V2 (v3) database release (approval required)
# Manual, main only. Runs exactly ONE separately approved Reports V2 database stage (PKG-A, B, C or D) against
# jncvvsvckxhqgqvkppmj: a SHA-256-pinned migration, release enable, ops script or guarded rollback in one psql
# transaction (the concurrent index outside one), or record-history with the pinned CLI's
# `migration repair --status applied`. Never db push / migration up; no other file can run. No frontend flag, Vercel
# variable or deploy is touched. Each dispatch needs Chris's separate approval, then the protected environment's review.
# Runner: scripts/reports_release.py. Design: docs/plans/2026-10-31-reports-v2/implementation_plan.md §2.7, §9.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Separately approved stage, in release order (check and read-back are read-only)
        required: true
        type: choice
        options: [check, read-back, record-history, disable-v3, disable-all, re-enable, apply-20261104120010, apply-20261104120011, apply-20261104120012, apply-20261104120013, apply-20261104120014, apply-20261104120015, apply-index-concurrently, apply-enable-20261104120017, apply-20261104120020, apply-20261104120021, apply-enable-20261104120022, apply-20261104120030, apply-20261104120031, apply-20261104120032, apply-enable-20261104120033, apply-20261104120040, category-baseline, apply-20261104120041, apply-20261104120042, apply-20261104120043, apply-enable-20261104120044, category-baseline-revert, rollback-20261104120043, rollback-20261104120042, rollback-20261104120041, rollback-20261104120040, rollback-20261104120032, rollback-20261104120031, rollback-20261104120020]
      confirm:
        description: Repeat the stage name exactly
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: reports-release
  cancel-in-progress: false
jobs:
  environment-guard:
    if: github.ref == 'refs/heads/main'
    name: Protected environment verified (no secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Required reviewer cgarness, main only, administrator bypass off
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/reports_release.py guard-environment
  release:
    needs: environment-guard
    if: github.ref == 'refs/heads/main'
    name: ${{ inputs.stage }} — one Reports V2 stage, frontend flags untouched
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: google-sheets-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install psql (no credentials)
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.121.0
      - name: Execute only the approved stage
        env:
          STAGE: ${{ inputs.stage }}
          CONFIRM: ${{ inputs.confirm }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
        run: python3 -I scripts/reports_release.py run
