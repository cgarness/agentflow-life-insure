name: Underwriting instant checkout (temporary)
on:
  push:
    branches: ['work/fflagent-underwriting-v1']
    paths: ['.github/workflows/underwriting-instant-checkout-once.yml']
permissions:
  contents: read
jobs:
  checkout:
    if: github.repository == 'cgarness/agentflow-life-insure' && github.ref == 'refs/heads/work/fflagent-underwriting-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 90f4cba66447e13c522b321f7b1c984223913368
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Export tracked frontend, task docs and locked tooling only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 90f4cba66447e13c522b321f7b1c984223913368
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p /tmp/uw-instant-export
          python3 - <<'PY'
          import subprocess,tarfile,json
          from pathlib import Path
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          allowed=[]
          for p in paths:
              f=Path(p)
              if any(x.startswith('.env') for x in f.parts):continue
              if p.startswith(('src/','public/','tests/underwriting/','scripts/underwriting/','docs/plans/2026-09-30-underwriting/')) or (len(f.parts)==1 and (f.suffix in ['.json','.ts','.js','.cjs','.html'] or p in ['AGENT_RULES.md','VISION.md','WORK_LOG.md'])) or p=='.github/workflows/underwriting-checks.yml':allowed.append(p)
          with tarfile.open('/tmp/uw-instant-export/source.tar.gz','w:gz') as t:
              for p in allowed:t.add(p,arcname=p,recursive=False)
          with tarfile.open('/tmp/uw-instant-export/dependencies.tar.gz','w:gz') as t:t.add('node_modules')
          Path('/tmp/uw-instant-export/manifest.json').write_text(json.dumps({'source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'paths':allowed},indent=2))
          print('Exported',len(allowed),'tracked frontend/task files; no environment files, credentials or git configuration.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: underwriting-instant-checkout
          path: /tmp/uw-instant-export/*
          retention-days: 2
          if-no-files-found: error
