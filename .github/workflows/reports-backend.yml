name: Reports backend verification
# Isolated synthetic databases only; no production credentials.
on:
  pull_request:
    paths:
      - 'supabase/migrations/*reports*.sql'
      - 'supabase/migrations/rollback/*reports*.sql'
      - 'supabase/ops/reports_*.sql'
      - 'supabase/tests/reports_*.sql'
      - 'scripts/run_reports_rpc_tests.sh'
      - 'scripts/run_reports_integrity_tests.sh'
      - 'scripts/reports_integrity_fixture.py'
      - 'scripts/run_reports_v3_tests.sh'
      - 'scripts/reports_v3_fixture.py'
      - 'scripts/reports_v3_reference.py'
      - 'scripts/run_reports_v3_differential.sh'
      - 'scripts/run_reports_v3_perf_acceptance.sh'
      - 'scripts/reports_v3_perf_verdict.py'
      - 'supabase/tests/reference/**'
      - 'scripts/tests/reports-visual/**'
      - 'src/pages/Reports.tsx'
      - 'src/components/reports/**'
      - 'src/hooks/useReportsData.ts'
      - 'src/lib/reports-*.ts'
      - 'src/lib/stat-computations.ts'
      - 'src/lib/report-layout*.ts'
      - 'supabase/migrations/20260806000000_baseline_production_schema.sql'
      - 'supabase/migrations/20260811200920_campaign_leads_membership_uniqueness_and_attachment_core.sql'
      - 'supabase/migrations/20260919183544_profile_book_and_team_stats_rpcs.sql'
      - '.github/workflows/reports-backend.yml'
  workflow_dispatch:
    inputs:
      performance_acceptance:
        description: 'Also run the two-run PostgreSQL 17.6 performance acceptance (147 combinations x 20 samples; long, manual only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: reports-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: postgres
        ports: ['55433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reports, policy, privacy, mutation, drift and recovery proofs
        env:
          PGURL: postgresql://postgres:isolated-test-only@127.0.0.1:55433
        run: |
          set -o pipefail
          bash scripts/run_reports_rpc_tests.sh 2>&1 | tee reports-backend-results.txt
          bash scripts/run_reports_integrity_tests.sh 2>&1 | tee reports-integrity-results.txt
          REPORTS_V3_PERF=0 bash scripts/run_reports_v3_tests.sh 2>&1 | tee reports-v3-results.txt
          bash scripts/run_profile_rpc_tests.sh 2>&1 | tee reports-profile-regression-results.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Install pinned isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/reports-browser" --no-save playwright@1.56.1 agent-browser@0.38.2 axe-core@4.10.2
          "$RUNNER_TEMP/reports-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real Reports page against native synthetic SQL payloads
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/reports-browser/node_modules/playwright
          REPORTS_SQL_PAYLOADS: ${{ github.workspace }}/reports-integrity-payloads.json
          REPORTS_VISUAL_OUTPUT: ${{ runner.temp }}/reports-visual-evidence
        run: |
          set -euo pipefail
          mkdir -p "$REPORTS_VISUAL_OUTPUT"
          export AGENT_BROWSER_EXECUTABLE_PATH="$(node -e 'process.stdout.write(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')"
          export AGENT_BROWSER_ALLOWED_DOMAINS=127.0.0.1
          REPORTS_BROWSER="$RUNNER_TEMP/reports-browser/node_modules/.bin/agent-browser"
          npx vite --config scripts/tests/reports-visual/vite.config.ts > "$RUNNER_TEMP/reports-vite.log" 2>&1 &
          REPORTS_VITE_PID=$!
          trap '"$REPORTS_BROWSER" --session reports-check close || true; kill "$REPORTS_VITE_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4180/ > /dev/null; then break; fi
            sleep 1
          done
          "$REPORTS_BROWSER" --session reports-check open http://127.0.0.1:4180
          "$REPORTS_BROWSER" --session reports-check wait --load networkidle
          "$REPORTS_BROWSER" --session reports-check screenshot "$REPORTS_VISUAL_OUTPUT/initial-page.png"
          "$REPORTS_BROWSER" --session reports-check snapshot -i > "$REPORTS_VISUAL_OUTPUT/initial-snapshot.txt"
          "$REPORTS_BROWSER" --session reports-check eval 'if (document.querySelector("h1")?.textContent !== "Reports" || document.querySelector("vite-error-overlay")) throw new Error("Reports page did not render")'
          "$REPORTS_BROWSER" --session reports-check errors > "$REPORTS_VISUAL_OUTPUT/initial-errors.txt"
          "$REPORTS_BROWSER" --session reports-check close
          node scripts/tests/reports-visual/verify.mjs 2>&1 | tee reports-browser-results.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reports-backend-evidence-${{ github.run_id }}
          path: |
            reports-backend-results.txt
            reports-profile-regression-results.txt
            reports-integrity-results.txt
            reports-v3-results.txt
            reports-integrity-payloads.json
            reports-browser-results.txt
            ${{ runner.temp }}/reports-visual-evidence
            ${{ runner.temp }}/reports-vite.log
          retention-days: 14

  differential:
    # Correctness evidence: the code under test against the reviewed baseline (4236b8a), fixtures and the 500k scale
    # organization. Runs on pull requests and manual dispatch.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: postgres
        ports: ['55433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Differential evidence against the reviewed baseline
        env:
          PGURL: postgresql://postgres:isolated-test-only@127.0.0.1:55433
          REPORTS_V3_EVIDENCE_DIR: ${{ runner.temp }}/reports-v3-evidence
        run: |
          set -o pipefail
          bash scripts/run_reports_v3_differential.sh > "$RUNNER_TEMP/reports-v3-differential.log" 2>&1 || { grep -v '^NOTICE' "$RUNNER_TEMP/reports-v3-differential.log" | tail -n 80; exit 1; }
          grep -v '^NOTICE' "$RUNNER_TEMP/reports-v3-differential.log" | grep -E '^==|differential|mismatch|passed|Evidence' | tail -n 40
          cat "$RUNNER_TEMP/reports-v3-evidence/differential/fixtures-summary.json" "$RUNNER_TEMP/reports-v3-evidence/differential/scale-summary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reports-v3-differential-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reports-v3-evidence
            ${{ runner.temp }}/reports-v3-differential.log
          retention-days: 14

  perf-acceptance:
    # Two independent acceptance runs of the same commit on separate runners; both must pass. Only when a manual
    # dispatch selects it: this is long and is never run for every small edit.
    if: github.event_name == 'workflow_dispatch' && inputs.performance_acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: postgres
        ports: ['55433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record the database image and runner
        run: |
          set -euo pipefail
          echo "REPORTS_V3_IMAGE=$(docker inspect --format '{{.Config.Image}} {{.Image}}' "${{ job.services.postgres.id }}") $(docker image inspect --format '{{join .RepoDigests ","}}' postgres:17.6)" >> "$GITHUB_ENV"
          echo "runner: $RUNNER_NAME ($ImageOS $ImageVersion); $(nproc) CPUs: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-); $(grep MemTotal /proc/meminfo)"
      - name: Performance acceptance run ${{ matrix.run }} (PostgreSQL 17.6, 147 combinations x 20 samples, enforced)
        env:
          PGURL: postgresql://postgres:isolated-test-only@127.0.0.1:55433
          REPORTS_V3_PERF_MODE: acceptance
          REPORTS_V3_PERF_SAMPLES: '20'
          REPORTS_V3_PERF_ENFORCE: '1'
          REPORTS_V3_RESTART_CMD: docker restart ${{ job.services.postgres.id }}
          REPORTS_V3_RUN_LABEL: acceptance-${{ matrix.run }}
          REPORTS_V3_EVIDENCE_DIR: ${{ runner.temp }}/reports-v3-evidence
        run: bash scripts/run_reports_v3_perf_acceptance.sh
      - name: Database service log
        if: always()
        run: docker logs "${{ job.services.postgres.id }}" > "$RUNNER_TEMP/reports-v3-evidence/performance/server.log" 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reports-v3-perf-acceptance-${{ matrix.run }}-${{ github.run_id }}
          path: ${{ runner.temp }}/reports-v3-evidence
          retention-days: 14

  perf-negative-control:
    # Proves the acceptance path detects a miss: the scope reader is slowed by 2.2 s in the disposable database, so the
    # same runner and gate must fail. The job passes only when that run fails for exactly that reason.
    if: github.event_name == 'workflow_dispatch' && inputs.performance_acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: postgres
        ports: ['55433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Negative control (the slowed reader must fail the enforced gate)
        env:
          PGURL: postgresql://postgres:isolated-test-only@127.0.0.1:55433
          REPORTS_V3_PERF_MODE: negative-control
          REPORTS_V3_PERF_SAMPLES: '20'
          REPORTS_V3_PERF_ENFORCE: '1'
          REPORTS_V3_RESTART_CMD: docker restart ${{ job.services.postgres.id }}
          REPORTS_V3_EVIDENCE_DIR: ${{ runner.temp }}/reports-v3-evidence
        run: |
          set -uo pipefail
          if bash scripts/run_reports_v3_perf_acceptance.sh; then echo '::error::the negative control did not fail'; exit 1; fi
          python3 scripts/reports_v3_perf_verdict.py negative-control "$REPORTS_V3_EVIDENCE_DIR/performance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reports-v3-perf-negative-control-${{ github.run_id }}
          path: ${{ runner.temp }}/reports-v3-evidence
          retention-days: 14

  perf-verdict:
    # The acceptance verdict over both runs (no best-of selection) and the negative control, from their artifacts.
    needs: [perf-acceptance, perf-negative-control]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.performance_acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Two-run acceptance verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verdicts"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/verdicts" --pattern 'reports-v3-perf-*'
          python3 scripts/reports_v3_perf_verdict.py negative-control "$RUNNER_TEMP/verdicts/reports-v3-perf-negative-control-$GITHUB_RUN_ID/performance"
          cd "$RUNNER_TEMP"
          python3 "$GITHUB_WORKSPACE/scripts/reports_v3_perf_verdict.py" aggregate --sha "$GITHUB_SHA" \
            "verdicts/reports-v3-perf-acceptance-1-$GITHUB_RUN_ID/performance" "verdicts/reports-v3-perf-acceptance-2-$GITHUB_RUN_ID/performance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reports-v3-perf-verdict-${{ github.run_id }}
          path: ${{ runner.temp }}/aggregate.json
          retention-days: 14
